services:
  yggdrasil:
    image: ghcr.io/yggdrasil-network/yggdrasil-go:latest
    container_name: ygg_exit_node
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./yggdrasil.conf:/etc/yggdrasil.conf
      - ygg_admin_sock:/var/run/yggdrasil
    command: ["-useconffile", "/etc/yggdrasil.conf"]
    restart: unless-stopped

  api-sidecar:
    image: jacobbermudes/ygg-api:latest 
    container_name: ygg_api_sidecar
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    volumes:
      - ygg_admin_sock:/var/run/yggdrasil
    depends_on:
      - yggdrasil
    restart: unless-stopped

  socks5:
    image: ginuerzh/gost
    container_name: ygg_socks5
    network_mode: "host"
    depends_on:
      - yggdrasil
    command: ["-L", "socks5://${YGG_IP}:1080"]
    restart: unless-stopped

volumes:
  ygg_admin_sock: