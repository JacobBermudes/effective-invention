services:
  yggdrasil:
    image: ghcr.io/yggdrasil-network/yggdrasil-go:latest
    container_name: ygg_exit_node
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./yggdrasil.conf:/etc/yggdrasil-network/config.conf
      - ygg_admin_sock:/var/run/yggdrasil
    restart: unless-stopped

  api-sidecar:
    image: jacobbermudes/ygg-api:latest 
    container_name: ygg_api_sidecar
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    volumes:
      - ygg_admin_sock:/var/run/yggdrasil
    depends_on:
      - yggdrasil
    restart: unless-stopped

  socks5:
    image: gogost/gost:latest
    container_name: socks5_exit
    network_mode: "host"
    depends_on:
      - yggdrasil
    command: -L "socks5://[202:7bf7:a058:5871:d6d9:dedc:fb85:7046]:1080"
    restart: unless-stopped

volumes:
  ygg_admin_sock: